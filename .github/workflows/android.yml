name: Android APK

# دو حالت:
#   • push روی main (یا اجرای دستی) → APK ساخته می‌شود و به‌عنوان Artifact می‌ماند
#   • push تگ نسخه (مثل v1.0.0)      → همان APK به Release همان نسخه پیوست می‌شود
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "web/**"
      - "android/**"
      - "resources/**"
      - "capacitor.config.json"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write      # لازم برای ساخت Release و پیوست کردن APK

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # رانرهای ubuntu-latest خودشان Android SDK دارند؛ فقط بسته‌های لازم را
      # نصب می‌کنیم. اکشن setup-android حذف شد چون پکیج قدیمی «tools» را
      # می‌خواست که دیگر در مخزن SDK وجود ندارد.
      - name: Install the Android platform and build tools
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER=$(ls -d "$SDK_ROOT"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1 || true)
          [ -n "$SDKMANAGER" ] || SDKMANAGER=$(command -v sdkmanager)
          echo "using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install dependencies
        run: npm ci

      - name: Sync web assets into the Android project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        env:
          # نام تگ، نسخه‌ی داخل اپ را تعیین می‌کند (v1.0.0 → 1.0.0)
          APP_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: exchance-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      # نام فایل پیوست‌شده به Release، نسخه‌دار می‌شود: exchance-1.0.0-debug.apk
      - name: Name the release asset
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          cp android/app/build/outputs/apk/debug/app-debug.apk "exchance-${VERSION}-debug.apk"
          echo "RELEASE_ASSET=exchance-${VERSION}-debug.apk" >> "$GITHUB_ENV"
          echo "RELEASE_TITLE=EXCHANCE ${VERSION}" >> "$GITHUB_ENV"

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ env.RELEASE_TITLE }}
          files: ${{ env.RELEASE_ASSET }}
          fail_on_unmatched_files: true
          generate_release_notes: true
          body: |
            نسخه‌ی اندروید EXCHANCE — داشبورد قیمت ارز، طلا و رمزارز.

            نصب: فایل APK زیر را دانلود کن و روی گوشی باز کن
            (اجازه‌ی «نصب از منابع نامعلوم» را برای مرورگر بده).

            این APK با کلید دیباگ امضا شده و برای نصب دستی مناسب است؛
            برای انتشار در گوگل‌پلی باید با کلید خودت امضا شود.
