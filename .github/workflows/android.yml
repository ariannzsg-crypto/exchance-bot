name: Android APK

# دو حالت:
#   • push روی main (یا اجرای دستی) → APK ساخته می‌شود و به‌عنوان Artifact می‌ماند
#   • push تگ نسخه (مثل v1.0.0)      → همان APK به Release همان نسخه پیوست می‌شود
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "web/**"
      - "android/**"
      - "resources/**"
      - "capacitor.config.json"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write      # لازم برای ساخت Release و پیوست کردن APK

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # رانرهای ubuntu-latest خودشان Android SDK دارند؛ فقط بسته‌های لازم را
      # نصب می‌کنیم. اکشن setup-android حذف شد چون پکیج قدیمی «tools» را
      # می‌خواست که دیگر در مخزن SDK وجود ندارد.
      - name: Install the Android platform and build tools
        run: |
          set -euo pipefail

          # مسیر SDK را حدس نمی‌زنیم: ایمیج‌های تازه‌ی رانر می‌توانند SDK را جای
          # دیگری بگذارند و Gradle بدون local.properties فقط به ANDROID_SDK_ROOT
          # تکیه می‌کند؛ نتیجه‌اش «SDK location not found» و مرگ سریع بیلد است.
          # پس ریشه را از جای واقعیِ sdkmanager حساب می‌کنیم و به هر دو نام
          # (ANDROID_HOME و ANDROID_SDK_ROOT) و به local.properties می‌دهیم.
          looks_like_sdk() { [ -d "$1/platforms" ] || [ -d "$1/cmdline-tools" ] || [ -d "$1/platform-tools" ]; }

          SDKMANAGER=$(command -v sdkmanager || true)
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          if [ -n "$SDKMANAGER" ]; then
            # SDK_ROOT/cmdline-tools/<version>/bin/sdkmanager → ریشه سه پله بالاتر
            DERIVED=$(cd "$(dirname "$(readlink -f "$SDKMANAGER")")/../../.." && pwd)
            if looks_like_sdk "$DERIVED"; then SDK_ROOT="$DERIVED"; fi
          fi
          [ -n "$SDKMANAGER" ] || SDKMANAGER=$(ls -d "$SDK_ROOT"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1 || true)

          echo "using SDK_ROOT=$SDK_ROOT sdkmanager=$SDKMANAGER"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "sdk.dir=$SDK_ROOT" > android/local.properties

          test -n "$SDKMANAGER" || { echo "sdkmanager not found and $SDK_ROOT has no cmdline-tools"; exit 1; }
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install dependencies
        run: npm ci

      - name: Sync web assets into the Android project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        env:
          # نام تگ، نسخه‌ی داخل اپ را تعیین می‌کند (v1.0.0 → 1.0.0)
          APP_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee gradle-build.log

      # خرابی بیلد اندروید داخل لاگ گیت‌هاب قفل است (دیدنش لاگین می‌خواهد). این
      # استپ خلاصه‌ی خطا را روی خودِ صفحه‌ی اجرا می‌گذارد تا از بیرون هم بشود
      # فهمید کجا شکسته — بدون اینکه لازم باشد کسی لاگین کند.
      - name: Explain the Android build failure
        if: failure()
        run: |
          {
            echo "## Android build diagnostics"
            echo
            echo "| what | value |"
            echo "| --- | --- |"
            echo "| java | \`$(java -version 2>&1 | head -1)\` |"
            echo "| ANDROID_SDK_ROOT | \`${ANDROID_SDK_ROOT:-unset}\` |"
            echo "| ANDROID_HOME | \`${ANDROID_HOME:-unset}\` |"
            echo "| sdkmanager | \`$(command -v sdkmanager || echo missing)\` |"
            echo "| sdk dir exists | \`$([ -d "${ANDROID_SDK_ROOT:-/nonexistent}" ] && echo yes || echo no)\` |"
            echo "| gradle wrapper | \`$(ls android/gradle/wrapper 2>/dev/null | tr '\n' ' ')\` |"
            echo
            echo '```'
            tail -n 200 android/gradle-build.log 2>/dev/null || echo "(gradle output was not captured)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: exchance-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      # نام فایل پیوست‌شده به Release، نسخه‌دار می‌شود: exchance-1.0.0-debug.apk
      - name: Name the release asset
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          cp android/app/build/outputs/apk/debug/app-debug.apk "exchance-${VERSION}-debug.apk"
          echo "RELEASE_ASSET=exchance-${VERSION}-debug.apk" >> "$GITHUB_ENV"
          echo "RELEASE_TITLE=EXCHANCE ${VERSION}" >> "$GITHUB_ENV"

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ env.RELEASE_TITLE }}
          files: ${{ env.RELEASE_ASSET }}
          fail_on_unmatched_files: true
          generate_release_notes: true
          body: |
            نسخه‌ی اندروید EXCHANCE — داشبورد قیمت ارز، طلا و رمزارز.

            نصب: فایل APK زیر را دانلود کن و روی گوشی باز کن
            (اجازه‌ی «نصب از منابع نامعلوم» را برای مرورگر بده).

            این APK با کلید دیباگ امضا شده و برای نصب دستی مناسب است؛
            برای انتشار در گوگل‌پلی باید با کلید خودت امضا شود.
