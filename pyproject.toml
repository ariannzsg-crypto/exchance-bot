# چرا این فایل وجود دارد؟
#
# ورسل این پروژه را به‌عنوان پایتون تشخیص داده (Framework Preset = Python) و با
# پریست پایتون، هر فایل `api/*.py` یک فانکشن جدا نمی‌شود؛ کل ترافیک به یک
# entrypoint می‌رسد. بدون این اعلان، بیلد با خطای زیر می‌میرد:
#
#     [PYTHON_ENTRYPOINT_NOT_FOUND] No python entrypoint found in default locations
#
# `api/index.py` همان entrypoint است: کلاس `handler` را دارد و درخواست‌های
# `/api/...` را به همان handler واقعیِ هر اندپوینت می‌سپارد (مسیر، کد وضعیت،
# هدرها و قرارداد JSON دست‌نخورده می‌ماند).
#
# اگر روزی Framework Preset را روی «Other» گذاشتی، این فایل بی‌اثر می‌شود و
# همان مدل فایلی (`api/*.py` = یک فانکشن برای هر فایل) برمی‌گردد؛ ماندنش ضرری
# ندارد.
#
# فقط همین یک جدول لازم است: نه `[project]`، نه `[build-system]`. وابستگی‌ها از
# `requirements.txt` نصب می‌شوند، نه از اینجا.
[tool.vercel]
entrypoint = "api.index:handler"
